name: Build and deploy

# A merged PR is a deployment: the page is rebuilt from the committed data and
# published to GitHub Pages. The build needs no network and no dependencies.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the site
        run: python3 tracker/build.py
      - name: Fail if the build changed a tracked file
        # docs/ is committed so the repo always shows what is live. If a build
        # from committed data produces something different, the two are out of
        # step and the PR should have included the rebuilt page.
        run: |
          if ! git diff --quiet -- docs; then
            echo "::error::docs/ is stale - run 'python3 tracker/build.py' and commit the result"
            git diff --stat -- docs
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
